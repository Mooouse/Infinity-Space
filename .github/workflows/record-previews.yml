name: Record CrazyGames previews
on:
  push:
    branches: [media/crazygames-preview-20261115]
    paths: ['tools/capture-preview.cjs', '.github/workflows/record-previews.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        format: [landscape, portrait]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Capture genuine gameplay at fixed 60 fps
        run: |
          python3 -m http.server 8765 > /tmp/server.log 2>&1 &
          node tools/capture-preview.cjs ${{ matrix.format }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameplay-${{ matrix.format }}
          path: recording/
          retention-days: 7
