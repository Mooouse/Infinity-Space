name: UI responsiveness and navigation audit
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'game.js'
      - 'cosmic-arena.html'
      - 'cosmic-worms.html'
      - 'cosmic-worms.js'
      - 'ui-worms.css'
      - 'unified-space.css'
      - 'secondary-design.css'
      - 'profile-report.css'
      - 'ui-app.css'
      - 'ui-v15*.js'
      - 'ui-arena.css'
      - 'worm-skin-studio.js'
      - 'menu-*.js'
      - 'player-profile.*'
      - 'index.html'
      - 'tests/ui-snapshot-diagnostics.cjs'
      - 'tests/full-ui-audit.cjs'
      - 'tests/menu-layout-audit.cjs'
      - 'tests/browser-smoke.cjs'
      - 'tests/mode-background-smoke.cjs'
      - 'tests/mode-achievements-smoke.cjs'
      - 'tests/worms-browser-smoke.cjs'
      - 'tests/crazygames-ads-smoke.cjs'
      - 'crazygames-extras.js'
      - 'tests/arena-ui-audit.cjs'
      - 'tests/gameplay-navigation-audit.cjs'
      - '.github/workflows/ui-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ui-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium
        run: |
          npm install --silent --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium --only-shell
      - name: Audit screens, Back navigation and responsive text
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/infinity-ui-audit-http.log 2>&1 &
          sleep 2
          timeout 50 node tests/renderer-startup-smoke.cjs
          timeout 200 node tests/ui-snapshot-diagnostics.cjs
          timeout 300 node tests/menu-layout-audit.cjs
          timeout 150 node tests/mode-achievements-smoke.cjs
          timeout 500 node tests/full-ui-audit.cjs
          timeout 600 node tests/worms-browser-smoke.cjs
          timeout 180 node tests/crazygames-ads-smoke.cjs
          timeout 400 node tests/arena-ui-audit.cjs
          timeout 180 node tests/gameplay-navigation-audit.cjs
