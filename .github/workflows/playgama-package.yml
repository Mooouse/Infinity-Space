name: Package one-file Infinity Space for Playgama
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '*.js'
      - '*.css'
      - '*.svg'
      - 'assets/**'
      - 'playgama-bridge-config.json'
      - 'tools/build_single_html.py'
      - 'tests/single-html-smoke.cjs'
      - '.github/workflows/playgama-package.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: infinity-space-single-html-release
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate the original game and the one-file builder
        run: |
          set -euo pipefail
          node --check game.js
          node --check platform.js
          node --check playgama-platform.js
          node --check playgama-ui.js
          python3 -m py_compile tools/build_single_html.py
          node -e "JSON.parse(require('fs').readFileSync('playgama-bridge-config.json','utf8'))"
          node tests/meta.cjs
          node tests/regressions.cjs
          node tests/music.cjs

      - name: Install static FFmpeg (without slow apt repository refresh)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet --target "$RUNNER_TEMP/ffmpeg-python" imageio-ffmpeg==0.8.1
          FFMPEG_EXE="$(PYTHONPATH="$RUNNER_TEMP/ffmpeg-python" python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          mkdir -p "$RUNNER_TEMP/ffmpeg-bin"
          ln -s "$FFMPEG_EXE" "$RUNNER_TEMP/ffmpeg-bin/ffmpeg"
          echo "$RUNNER_TEMP/ffmpeg-bin" >> "$GITHUB_PATH"
          "$FFMPEG_EXE" -version | head -1

      - name: Build under-20-MB HTML and Playgama ZIP with real root-level config
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 tools/build_single_html.py dist/index.html
          python3 - <<'PY'
          from pathlib import Path
          import json
          root = Path('dist')
          standalone = root / 'index.html'
          upload = root / 'playgama' / 'index.html'
          config = root / 'playgama' / 'playgama-bridge-config.json'
          assert standalone.is_file() and upload.is_file() and config.is_file()
          assert standalone.stat().st_size < 20_000_000
          assert upload.stat().st_size < 20_000_000
          for page in [standalone, upload]:
              content = page.read_text(encoding='utf-8')
              assert content.count('type="application/octet-stream" id="inline-audio-') == 12
              assert content.count('data:image/jpeg;base64,') >= 12
              assert 'data:audio/mp4;base64,' in content
              assert 'https://bridge.playgama.com/v2/stable/playgama-bridge.js' in content
          assert '<script>window.SpaceInlineBridgeConfig=' in standalone.read_text(encoding='utf-8')
          # Crucial: no embedded config URL in Playgama upload. Bridge.initialize()
          # must fetch its DEFAULT relative file (which is physically in ZIP).
          assert '<script>window.SpaceInlineBridgeConfig=' not in upload.read_text(encoding='utf-8')
          assert json.loads(config.read_text(encoding='utf-8')) == json.loads(Path('playgama-bridge-config.json').read_text(encoding='utf-8'))
          print('PASS: 12 tracks, covers, standalone inline config, upload defaults to root JSON')
          PY
          (cd dist/playgama && zip -q -9 ../../infinity-space-playgama.zip index.html playgama-bridge-config.json)
          python3 - <<'PY'
          from zipfile import ZipFile
          with ZipFile('infinity-space-playgama.zip') as z:
              assert set(z.namelist()) == {'index.html', 'playgama-bridge-config.json'}, z.namelist()
              assert z.testzip() is None
              print('PASS: Playgama ZIP root has index.html AND playgama-bridge-config.json')
          PY
          ls -lh dist/index.html dist/playgama/index.html infinity-space-playgama.zip

      - name: Browser-test standalone and actual Playgama archive HTML with root config
        shell: bash
        run: |
          set -euo pipefail
          npm install --silent --no-audit --no-fund --prefix "$RUNNER_TEMP/infinity-single-test" playwright@1.56.1
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/infinity-single-chromium"
          "$RUNNER_TEMP/infinity-single-test/node_modules/.bin/playwright" install chromium --only-shell
          python3 -m http.server 8766 --directory dist --bind 127.0.0.1 > "$RUNNER_TEMP/infinity-single-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          export NODE_PATH="$RUNNER_TEMP/infinity-single-test/node_modules"
          timeout 120 node tests/single-html-smoke.cjs

      - name: Upload ONE HTML as a download
        uses: actions/upload-artifact@v4
        with:
          name: infinity-space-single-html
          path: dist/index.html
          retention-days: 1
          if-no-files-found: error

      - name: Upload Playgama ZIP (root HTML plus Bridge JSON config)
        uses: actions/upload-artifact@v4
        with:
          name: infinity-space-playgama
          path: infinity-space-playgama.zip
          retention-days: 1
          if-no-files-found: error

      - name: Publish direct HTML download URL (no artifact ZIP wrapper)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="infinity-space-single-html"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "Infinity Space — One HTML (Playgama)" \
              --notes "One-file HTML under 20 MB with all 12 compressed music tracks, covers, inlined code and Playgama Bridge v2. Playgama ZIP includes index.html and playgama-bridge-config.json in its root, as required. Release files are overwritten with each new build." \
              --latest=false
          fi
          gh release upload "$TAG" dist/index.html --clobber
          gh release upload "$TAG" infinity-space-playgama.zip --clobber
          gh release view "$TAG" --json assets --jq '.assets[] | [.name,.size,.url] | @tsv'
