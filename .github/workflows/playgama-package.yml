name: Package Infinity Space HQ music for Playgama
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '*.js'
      - '*.css'
      - '*.svg'
      - 'assets/**'
      - 'playgama-bridge-config.json'
      - 'tools/build_single_html.py'
      - 'tests/single-html-smoke.cjs'
      - '.github/workflows/playgama-package.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: infinity-space-single-html-release
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate the original game and the one-file builder
        run: |
          set -euo pipefail
          node --check game.js
          node --check platform.js
          node --check playgama-platform.js
          node --check playgama-ui.js
          python3 -m py_compile tools/build_single_html.py
          node -e "JSON.parse(require('fs').readFileSync('playgama-bridge-config.json','utf8'))"
          node tests/meta.cjs
          node tests/regressions.cjs
          node tests/music.cjs

      - name: Bundle all 12 original-quality CrazyGames MP3 tracks (no transcoding)
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 tools/build_single_html.py dist/index.html
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path('dist')
          standalone = root / 'index.html'
          upload = root / 'playgama' / 'index.html'
          cfg = root / 'playgama' / 'playgama-bridge-config.json'
          assert standalone.is_file() and upload.is_file() and cfg.is_file()
          assert standalone.stat().st_size < 20_000_000
          assert upload.stat().st_size < 20_000_000
          assert '<script>window.SpaceInlineBridgeConfig=' in standalone.read_text('utf-8')
          assert '<script>window.SpaceInlineBridgeConfig=' not in upload.read_text('utf-8')
          assert json.loads(cfg.read_text('utf-8')) == json.loads(Path('playgama-bridge-config.json').read_text('utf-8'))
          for page in [standalone,upload]:
              content=page.read_text('utf-8')
              assert content.count('data:image/jpeg;base64,') >= 12
              assert 'https://bridge.playgama.com/v2/stable/playgama-bridge.js' in content
              assert 'data:audio/mp4;base64,' not in content
              assert 'inline-audio-' not in content
          assert 'https://mooouse.github.io/Infinity-Space/assets/music/' in standalone.read_text('utf-8')
          for number in range(1,13):
              name=f'track-{number:02d}.mp3'
              source=Path('assets/music')/name
              packaged=root/'playgama'/'assets'/'music'/name
              assert source.stat().st_size > 1_000_000
              assert source.stat().st_size == packaged.stat().st_size
              assert hashlib.sha256(source.read_bytes()).digest() == hashlib.sha256(packaged.read_bytes()).digest()
          assert all(f'assets/music/track-{n:02d}.mp3' in upload.read_text('utf-8') for n in range(1,13))
          print('PASS: all 12 Playgama MP3 files byte-for-byte match CrazyGames originals')
          PY
          (cd dist/playgama && zip -q -9 ../../infinity-space-playgama.zip index.html playgama-bridge-config.json)
          (cd dist/playgama && zip -q -0 -r ../../infinity-space-playgama.zip assets/music)
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile('infinity-space-playgama.zip') as z:
              expected={'index.html','playgama-bridge-config.json'} | {f'assets/music/track-{n:02d}.mp3' for n in range(1,13)}
              # Zip may include directory entries; ignore folder names.
              actual={i.filename for i in z.infolist() if not i.is_dir()}
              assert actual == expected,actual.symmetric_difference(expected)
              assert z.testzip() is None
              for n in range(1,13):
                  name=f'assets/music/track-{n:02d}.mp3'
                  assert hashlib.sha256(z.read(name)).digest() == hashlib.sha256(Path(name).read_bytes()).digest()
              print('PASS: Playgama ZIP has SDK JSON + game HTML + all 12 ORIGINAL MP3s')
          PY
          ls -lh dist/index.html dist/playgama/index.html infinity-space-playgama.zip

      - name: Browser-test high-quality music sources and Playgama root config
        shell: bash
        run: |
          set -euo pipefail
          npm install --silent --no-audit --no-fund --prefix "$RUNNER_TEMP/infinity-single-test" playwright@1.56.1
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/infinity-single-chromium"
          "$RUNNER_TEMP/infinity-single-test/node_modules/.bin/playwright" install chromium --only-shell
          python3 -m http.server 8766 --directory dist --bind 127.0.0.1 > "$RUNNER_TEMP/infinity-single-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          export NODE_PATH="$RUNNER_TEMP/infinity-single-test/node_modules"
          timeout 120 node tests/single-html-smoke.cjs

      - name: Upload high-quality-music single HTML (streams original MP3s)
        uses: actions/upload-artifact@v4
        with:
          name: infinity-space-single-html
          path: dist/index.html
          retention-days: 1
          if-no-files-found: error

      - name: Upload Playgama ZIP (HTML, Bridge JSON and 12 original MP3s)
        uses: actions/upload-artifact@v4
        with:
          name: infinity-space-playgama
          path: infinity-space-playgama.zip
          retention-days: 1
          if-no-files-found: error

      - name: Publish direct HTML download URL (no artifact ZIP wrapper)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="infinity-space-single-html"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "Infinity Space — One HTML (Playgama)" \
              --notes "Standalone HTML under 20 MB streams full-quality original tracks. Playgama ZIP includes index.html, playgama-bridge-config.json and all 12 original high-quality MP3 music files. No audio transcoding. Release files are overwritten with each new build." \
              --latest=false
          fi
          gh release upload "$TAG" dist/index.html --clobber
          gh release upload "$TAG" infinity-space-playgama.zip --clobber
          gh release view "$TAG" --json assets --jq '.assets[] | [.name,.size,.url] | @tsv'
