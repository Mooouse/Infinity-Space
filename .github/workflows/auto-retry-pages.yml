name: Auto-retry failed GitHub Pages publishing
on:
  workflow_run:
    workflows: ['Test and publish game']
    types: [completed]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
concurrency:
  group: pages-auto-retry
  cancel-in-progress: false
jobs:
  retry-latest-failed-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retry the latest failed Pages run, maximum twice
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Only consider the newest publication, and only for current main.
          # Old failures and automatically cancelled superseded builds are ignored.
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/runs?branch=main&per_page=10" \
            --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")][0]')"
          if [[ -z "$latest" || "$latest" == "null" ]]; then
            echo "No publishing run to monitor."
            exit 0
          fi

          run_id="$(jq -r '.id' <<< "$latest")"
          run_sha="$(jq -r '.head_sha' <<< "$latest")"
          status="$(jq -r '.status' <<< "$latest")"
          conclusion="$(jq -r '.conclusion' <<< "$latest")"
          attempt="$(jq -r '.run_attempt' <<< "$latest")"
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}"

          {
            echo "### GitHub Pages failure watch"
            echo "Latest publication: ${url}"
            echo "Status: ${status}; conclusion: ${conclusion}; attempt: ${attempt}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$run_sha" != "$main_sha" ]]; then
            echo "New code is already on main. Ignore obsolete failed runs."
            exit 0
          fi
          if [[ "$status" != "completed" ]]; then
            echo "Latest publication is still running. No action needed."
            exit 0
          fi
          if [[ "$conclusion" != "failure" && "$conclusion" != "timed_out" ]]; then
            echo "Latest publication is not a failure; do not rerun."
            exit 0
          fi
          if (( attempt >= 3 )); then
            echo "::warning::Publishing failed on all three attempts: ${url}"
            echo "Automatic retries exhausted. Inspect the logs and fix the root cause." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Retry failed jobs rather than rerun the full workflow. Concurrency
          # and the attempt limit prevent repeated, wasteful restarts.
          echo "Retrying failed jobs from ${url}, next attempt $((attempt + 1))/3"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/rerun-failed-jobs"
          echo "Retry requested (attempt $((attempt + 1))/3)." >> "$GITHUB_STEP_SUMMARY"
