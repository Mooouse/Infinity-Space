name: Test and publish game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check game syntax and required files
        run: |
          node --check game.js
          node --check cosmic-worms.js
          node --check platform.js
          node --check space-meta.js
          node tests/reward-navigation.cjs
          node tests/meta.cjs
          node tests/regressions.cjs
          node tests/music.cjs
          node tests/joystick.cjs
          node tests/mobile-controls.cjs
          test -s index.html
          test -s ui-app.css
          test -s favicon.svg
      - name: Release gate — browser gameplay and responsive UI
        shell: bash
        run: |
          set -euo pipefail
          npm install --silent --no-audit --no-fund --prefix "$RUNNER_TEMP/infiniti-browser-test" playwright@1.56.1
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/infiniti-chromium"
          "$RUNNER_TEMP/infiniti-browser-test/node_modules/.bin/playwright" install chromium --only-shell
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/infiniti-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          export NODE_PATH="$RUNNER_TEMP/infiniti-browser-test/node_modules"
          export INFINITI_SMOKE_URL="http://127.0.0.1:8765"
          timeout 220 node tests/browser-smoke.cjs
          timeout 180 node tests/arcade-browser-smoke.cjs
          timeout 180 node tests/mode-background-smoke.cjs
          timeout 300 node tests/menu-layout-audit.cjs
          timeout 150 node tests/worms-browser-smoke.cjs
          timeout 500 node tests/full-ui-audit.cjs
          timeout 180 node tests/profile-live-demo-smoke.cjs
          timeout 150 node tests/mode-achievements-smoke.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare lean website payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/space-pages/assets"
          cp index.html cosmic-arena.html cosmic-worms.html playgama-bridge-config.json ./*.js ./*.css ./*.svg "$RUNNER_TEMP/space-pages/"
          cp -R assets/music "$RUNNER_TEMP/space-pages/assets/"
          test -s "$RUNNER_TEMP/space-pages/index.html"
          test -s "$RUNNER_TEMP/space-pages/cosmic-arena.html"
          test -s "$RUNNER_TEMP/space-pages/cosmic-worms.html"
          test -s "$RUNNER_TEMP/space-pages/playgama-bridge-config.json"
          test -s "$RUNNER_TEMP/space-pages/assets/music/track-01.mp3"
          echo "Deploying only playable game, scripts, styles and original music:"
          du -sh "$RUNNER_TEMP/space-pages"
      - name: Upload game for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/space-pages
          retention-days: 1
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
          reporting_interval: 10000
      - name: Clean up temporary Pages archive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '.artifacts[].id' > "$RUNNER_TEMP/artifacts.txt" || true
          while IFS= read -r artifact_id; do
            [ -n "$artifact_id" ] || continue
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" >/dev/null || true
          done < "$RUNNER_TEMP/artifacts.txt"
