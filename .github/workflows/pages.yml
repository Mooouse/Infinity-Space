name: Test and publish game
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compose original soundtrack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install numpy==2.3.5
          python tools/compose_soundtrack.py
      - name: Validate and package
        run: |
          node --check tests/production-browser.cjs
          node tests/release.cjs
          python tools/build_release.py
      - name: Browser checks
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium --only-shell
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/space-http.log 2>&1 &
          node tests/production-browser.cjs
      - name: Save UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-screenshots
          path: screenshots
      - name: Save CrazyGames package
        uses: actions/upload-artifact@v4
        with:
          name: infinity-space-crazygames
          path: infinity-space-crazygames.zip
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
