name: UI Atlas visual snapshot capture
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ui-atlas-snapshots.yml'
      - 'tools/ui-capture.cjs'
      - 'ui-review.html'
      - 'ui-app.css'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install browser
        run: |
          npm install --silent --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium --only-shell
      - name: Capture all real game screens at desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/infinity-atlas-http.log 2>&1 &
          sleep 2
          timeout 560 node tools/ui-capture.cjs
      - name: Publish visual review snapshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui-snapshots/
          if git diff --cached --quiet; then
            echo "All screenshots unchanged"
          else
            git commit -m "Refresh full UI Atlas screenshot gallery"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
