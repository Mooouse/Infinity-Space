name: Build CrazyGames multi-file ZIP
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'cosmic-arena.html'
      - 'cosmic-worms.html'
      - '*.js'
      - '*.css'
      - '*.svg'
      - 'assets/music/*.jpg'
      - 'tools/build_crazygames_zip.py'
      - 'tests/crazygames-zip-smoke.cjs'
      - '.github/workflows/crazygames-zip.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: crazygames-multifile-zip
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check original game and ZIP build scripts
        run: |
          set -euo pipefail
          node --check platform.js
          node --check game.js
          node --check cosmic-worms.js
          node --check crazygames-extras.js
          node --check tests/crazygames-zip-smoke.cjs
          python3 -m py_compile tools/build_crazygames_zip.py
          node tests/music.cjs
          node tests/meta.cjs

      - name: Build complete CrazyGames ZIP, entry point at root
        run: |
          set -euo pipefail
          python3 tools/build_crazygames_zip.py dist-crazygames-files/infinity-space-crazygames.zip
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          p=Path('dist-crazygames-files/infinity-space-crazygames.zip')
          assert 0<p.stat().st_size<20_000_000
          with ZipFile(p) as zip:
              paths={file.filename for file in zip.infolist()}
              assert zip.testzip() is None
              assert {'index.html','cosmic-arena.html','cosmic-worms.html',
                      'game.js','platform.js','crazygames-extras.js',
                      'music-tracks.js','ui-app.css','favicon.svg'}.issubset(paths)
              assert sum(x.startswith('assets/music/') and x.endswith('.jpg') for x in paths)==12
              assert all(not x.startswith('playgama-') and not x.endswith('.mp3') for x in paths)
              for name in ('index.html','cosmic-arena.html','cosmic-worms.html'):
                  html=zip.read(name).decode('utf8')
                  assert 'https://bridge.playgama.com/' not in html
                  assert 'playgama-platform.js' not in html
                  assert 'playgama-ui.js' not in html
              tracks=zip.read('music-tracks.js').decode('utf8')
              assert tracks.count('https://mooouse.github.io/Infinity-Space/assets/music/')==12
          print('PASS: root index, all mode HTML files, correct 12 HQ music URLs, no Playgama SDK')
          PY

      - name: Smoke-test extracted ZIP on desktop and phones in Chromium
        run: |
          set -euo pipefail
          npm install --silent --no-audit --no-fund --prefix "$RUNNER_TEMP/crazy-zip-test" playwright@1.56.1
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/crazy-zip-chromium"
          "$RUNNER_TEMP/crazy-zip-test/node_modules/.bin/playwright" install chromium --only-shell
          python3 -m http.server 8768 --directory dist-crazygames-files/upload-root --bind 127.0.0.1 > "$RUNNER_TEMP/crazy-zip-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          export NODE_PATH="$RUNNER_TEMP/crazy-zip-test/node_modules"
          timeout 240 node tests/crazygames-zip-smoke.cjs

      - name: Publish CrazyGames ZIP as an Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: infinity-space-crazygames-zip
          path: dist-crazygames-files/infinity-space-crazygames.zip
          retention-days: 14
          if-no-files-found: error

      - name: Publish direct CrazyGames ZIP download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="infinity-space-crazygames-zip"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "Infinity Space — CrazyGames upload ZIP" \
              --notes "The complete multi-file game, index.html at the ZIP root, all modes and their JS/CSS and artwork. CrazyGames SDK v3 only, under 20 MB. Original high-quality MP3s stream from the public music host and require internet." \
              --latest=false
          fi
          gh release upload "$TAG" dist-crazygames-files/infinity-space-crazygames.zip --clobber
          gh release view "$TAG" --json assets --jq '.assets[] | [.name,.size,.url] | @tsv'
